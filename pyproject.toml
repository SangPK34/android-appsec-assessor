[project]
name = "android-security-lab"
version = "0.5.1"
description = "Windows-native Android security assessment lab with a local FastAPI UI"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "physical_android: requires an explicitly enabled physical Android device",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
