schema_version: 1
rules:
  - id: ASL-CONFIG-DEBUGGABLE
    evaluator: app_debuggable
    title: Debuggable or test-only application build
    category: code-quality
    description: The installed application build permits debugging or is marked test-only.
    severity: high
    confidence: high
    required_capabilities: [AAPT2_AVAILABLE]
    inputs: [app.manifest.debuggable, app.manifest.test_only]
    validation_type: none
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Disable android:debuggable and android:testOnly in release builds.

  - id: ASL-NETWORK-CLEARTEXT
    evaluator: cleartext
    title: Cleartext network traffic or permissive cleartext configuration
    category: network
    description: Cleartext is enabled in configuration or HTTP traffic was observed dynamically.
    severity: high
    confidence: high
    required_capabilities: [AAPT2_AVAILABLE]
    inputs: [app.manifest.uses_cleartext_traffic, traffic.events]
    validation_type: adb_assisted_validation
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Enforce HTTPS and deny cleartext traffic in Network Security Configuration.

  - id: ASL-RUNTIME-SENSITIVE-SINK
    evaluator: sensitive_token
    title: Sensitive canary reached an exposed runtime sink
    category: data-storage
    description: Correlates an exact session canary with package-attributed traffic, log, WebView, clipboard, notification, intent, broadcast, or provider sinks; persisted application storage is evaluated by its dedicated rule family.
    severity: high
    confidence: high
    required_capabilities: [ADB_AUTHORIZED]
    inputs: [traffic.events, logcat.sensitive_marker_types, frida.events]
    validation_type: adb_assisted_validation
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Keep sensitive values out of exposed sinks and enforce an explicit, protected trust boundary before sharing data.

  - id: ASL-IPC-EXPORTED-COMPONENT
    evaluator: exported_component
    title: Exported component without an explicit protection boundary
    category: platform
    description: A non-launcher component is exported without an explicit permission boundary.
    severity: medium
    confidence: medium
    required_capabilities: [AAPT2_AVAILABLE]
    inputs: [app.manifest.components]
    validation_type: adb_assisted_validation
    validation_observable: Target-process evidence contains the exact controlled canary after launch.
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Disable unnecessary exports or enforce a signature-level permission and input validation.

  - id: ASL-NETWORK-TLS-TRUST
    evaluator: tls_interception
    title: TLS interception and certificate trust behavior
    category: network
    description: Records whether HTTPS completed through the configured lab interception proxy.
    severity: medium
    confidence: medium
    required_capabilities: [MITMPROXY_AVAILABLE]
    inputs: [traffic.events, frida.events]
    validation_type: instrumented_validation
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Define the intended trust model and use pinning only where justified by the threat model.

  - id: ASL-MANIFEST-ALLOW-BACKUP
    evaluator: manifest_policy
    title: Application backup policy
    category: configuration
    description: Evaluates the normalized allowBackup manifest attribute.
    severity: medium
    confidence: medium
    validation_type: none
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Review backup policy against the application's data protection requirements.

  - id: ASL-MANIFEST-EXPORTED-ACTIVITY
    evaluator: manifest_policy
    title: Exported activity protection boundary
    category: platform
    description: Evaluates exported activities and their normalized permission boundary.
    severity: medium
    confidence: medium
    validation_type: none
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Restrict exported activities or enforce an appropriate permission.

  - id: ASL-MANIFEST-EXPORTED-SERVICE
    evaluator: manifest_policy
    title: Exported service protection boundary
    category: platform
    description: Evaluates exported services and their effective permission boundary.
    severity: medium
    confidence: medium
    validation_type: none
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Restrict exported services or enforce an appropriate signature-level permission.

  - id: ASL-MANIFEST-EXPORTED-RECEIVER
    evaluator: manifest_policy
    title: Exported receiver protection boundary
    category: platform
    description: Evaluates exported receivers and their normalized permission boundary.
    severity: medium
    confidence: medium
    validation_type: none
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Restrict exported receivers or enforce an appropriate permission.

  - id: ASL-MANIFEST-EXPORTED-PROVIDER
    evaluator: manifest_policy
    title: Exported provider protection boundary
    category: platform
    description: Evaluates exported providers and their normalized permission boundary.
    severity: high
    confidence: medium
    validation_type: none
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Restrict exported providers and review read/write permissions.

  - id: ASL-MANIFEST-CUSTOM-PERMISSION
    evaluator: manifest_policy
    title: Weak custom permission protection level
    category: platform
    description: Evaluates custom permission definitions and their effective base protection level.
    severity: medium
    confidence: high
    validation_type: none
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Protect security-sensitive IPC with a uniquely named signature-level permission.

  - id: ASL-MANIFEST-FILEPROVIDER-PATHS
    evaluator: manifest_policy
    title: Broad FileProvider path exposure
    category: data-storage
    description: Evaluates resolved FileProvider path mappings and URI grant configuration.
    severity: high
    confidence: medium
    validation_type: none
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Expose only narrowly scoped application-owned directories through FileProvider.

  - id: ASL-MANIFEST-DEEP-LINK-EXPOSURE
    evaluator: manifest_policy
    title: Broad or weakly protected deep-link entry point
    category: platform
    description: Evaluates exported browsable intent filters, URI restrictions, and permission boundaries.
    severity: medium
    confidence: medium
    validation_type: none
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Constrain schemes, hosts, and paths; verify app links and validate every incoming URI.

  - id: ASL-STATIC-HARDCODED-SECRET
    evaluator: static_secret_candidate
    title: Hardcoded secret candidate in packaged application content
    category: secrets
    description: Evaluates bounded APK, DEX, resource, and asset strings for contextual secret candidates.
    severity: high
    confidence: medium
    validation_type: none
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Remove deployable secrets from application packages and rotate any exposed credential.

  - id: ASL-STATIC-API-POLICY
    evaluator: static_api_policy
    title: Banned or deprecated API method reference
    category: platform-api
    description: Evaluates exact DEX method references against the configured banned and deprecated API policy without assuming invocation, reachability, or runtime impact.
    severity: medium
    confidence: medium
    validation_type: none
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Replace banned APIs and migrate deprecated APIs to supported platform behavior after reviewing each reachable call-site.

  - id: ASL-STATIC-DYNAMIC-CODE
    evaluator: static_behavior_candidate
    title: Dynamic code-loading call-site candidate
    category: code-loading
    description: Evaluates bounded DEX call-sites for dynamic code-loading behavior without assuming that the call-site executes or is reachable.
    severity: high
    confidence: medium
    validation_type: none
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Avoid loading executable code from writable or untrusted locations and verify the provenance and integrity of every dynamically loaded artifact.

  - id: ASL-STATIC-DESERIALIZATION
    evaluator: static_behavior_candidate
    title: Deserialization call-site candidate
    category: input-validation
    description: Evaluates bounded DEX call-sites for object deserialization without assuming attacker influence, execution, or runtime reachability.
    severity: high
    confidence: medium
    validation_type: none
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Do not deserialize untrusted objects; use a constrained data format and enforce explicit type and input validation.

  - id: CRYPTO-ECB
    evaluator: crypto_runtime
    title: ECB cipher mode usage
    category: crypto
    description: Correlates attributed runtime crypto metadata for ECB mode and retains bounded static DEX call-sites as potential findings until execution and reachability are observed.
    severity: medium
    confidence: high
    validation_type: instrumented_validation
    frida_required: true
    observation_only: false
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Use an authenticated mode with a fresh IV instead of ECB.

  - id: CRYPTO-WEAK-ALGORITHM
    evaluator: crypto_runtime
    title: Weak cryptographic algorithm usage
    category: crypto
    description: Correlates attributed runtime crypto metadata for configured weak algorithms and retains bounded static DEX call-sites as potential findings until execution and reachability are observed.
    severity: high
    confidence: high
    validation_type: instrumented_validation
    frida_required: true
    observation_only: false
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Replace weak algorithms with a modern, policy-approved primitive.

  - id: CRYPTO-SHORT-KEY
    evaluator: crypto_runtime
    title: Symmetric key length below policy observed at runtime
    category: crypto
    description: Evaluates normalized runtime key-length metadata for completed symmetric operations.
    severity: high
    confidence: high
    validation_type: instrumented_validation
    frida_required: true
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Use a policy-approved key size and managed key generation.

  - id: CRYPTO-ZERO-IV
    evaluator: crypto_runtime
    title: All-zero IV observed at runtime
    category: crypto
    description: Detects an all-zero IV on a completed encryption operation without retaining IV material.
    severity: medium
    confidence: high
    validation_type: instrumented_validation
    frida_required: true
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Generate a fresh unpredictable IV of the required length for every encryption operation.

  - id: CRYPTO-REUSED-IV
    evaluator: crypto_runtime
    title: IV reused with the same key at runtime
    category: crypto
    description: Correlates IV and key fingerprints across completed encryption operations in one session.
    severity: high
    confidence: high
    validation_type: instrumented_validation
    frida_required: true
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Never reuse an IV with the same key where the selected mode requires uniqueness.

  - id: CRYPTO-WEAK-DIGEST
    evaluator: crypto_runtime
    title: Weak digest or MAC usage
    category: crypto
    description: Correlates completed MD5, SHA-1, or HMAC-SHA1 operations and retains bounded static DEX call-sites as potential findings while preserving execution and data-context uncertainty.
    severity: medium
    confidence: medium
    validation_type: instrumented_validation
    frida_required: true
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Replace weak digest and MAC algorithms in security-sensitive flows.

  - id: CRYPTO-LOW-PBE-ITERATIONS
    evaluator: crypto_runtime
    title: Password-based derivation iteration count below policy
    category: crypto
    description: Correlates bounded runtime PBE iteration metadata and retains bounded static low-iteration call-sites as potential findings until execution and reachability are observed.
    severity: medium
    confidence: medium
    validation_type: instrumented_validation
    frida_required: true
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Use a policy-approved password-based KDF and iteration count.

  - id: CRYPTO-PREDICTABLE-RANDOM
    evaluator: crypto_runtime
    title: Predictable random source used as cryptographic material
    category: crypto
    description: Correlates runtime weak-random output with key or IV material and retains bounded static weak-random crypto call-sites as potential findings until execution and data flow are observed.
    severity: medium
    confidence: high
    validation_type: instrumented_validation
    frida_required: true
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Generate cryptographic keys and IVs with SecureRandom or a platform key-management API.

  - id: WEBVIEW-JS-BRIDGE-REMOTE
    evaluator: webview_security
    title: JavaScript bridge exposed to remote WebView content
    category: webview
    description: Correlates JavaScript enablement, a JavaScript interface, and remote content at runtime while retaining bounded static same-method call-sites as potential findings until reachability is observed.
    severity: high
    confidence: medium
    validation_type: instrumented_validation
    frida_required: true
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Remove unnecessary bridges and expose them only to strictly trusted content.

  - id: WEBVIEW-UNSAFE-SETTINGS
    evaluator: webview_security
    title: Security-relevant WebView setting enabled
    category: webview
    description: Evaluates unsafe file-URL access, permissive mixed content, and WebView debugging at runtime while retaining bounded static setting call-sites as potential findings until reachability is observed.
    severity: medium
    confidence: medium
    validation_type: instrumented_validation
    frida_required: true
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Disable permissive WebView settings unless a reviewed application requirement exists.

  - id: WEBVIEW-SSL-ERROR-PROCEED
    evaluator: webview_security
    title: WebView continued after an SSL certificate error
    category: network
    description: Detects package-attributed SslErrorHandler.proceed behavior and retains bounded static callback call-sites as potential findings until execution and reachability are observed.
    severity: high
    confidence: high
    validation_type: evidence_correlation
    frida_required: false
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Cancel WebView SSL errors and correct the server or trust configuration.

  - id: STORAGE-WORLD-READABLE
    evaluator: storage_security
    title: World-readable private-storage file
    category: data-storage
    description: Evaluates bounded package storage permissions and retains static world-readable file-mode call-sites as potential findings until execution and resulting file permissions are observed.
    severity: medium
    confidence: high
    validation_type: root_assisted_validation
    root_required: true
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Restrict private application files to the owning application UID.

  - id: STORAGE-WORLD-WRITABLE
    evaluator: storage_security
    title: World-writable private-storage file
    category: data-storage
    description: Evaluates bounded package storage permissions and retains static world-writable file-mode call-sites as potential findings until execution and resulting file permissions are observed.
    severity: high
    confidence: high
    validation_type: root_assisted_validation
    root_required: true
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Remove other-UID write access from application-owned files.

  - id: STORAGE-SENSITIVE-CANARY
    evaluator: storage_security
    title: Exact session canary persisted in plaintext package storage
    category: data-storage
    description: Correlates runtime storage writes or a bounded exact-canary match with package-owned storage without treating root readability as a weakness.
    severity: high
    confidence: high
    validation_type: evidence_correlation
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Avoid persisting sensitive values in plaintext and apply appropriate cryptographic protection.

  - id: ASL-RUNTIME-WEBVIEW
    evaluator: runtime_observation
    title: WebView runtime observation
    category: runtime-observation
    description: Records package-attributed WebView events without treating loadUrl alone as a vulnerability.
    severity: info
    confidence: medium
    observation_only: true
    validation_type: instrumented_validation
    frida_required: true
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Review observed WebView configuration in application context.

  - id: ASL-RUNTIME-LOGGING
    evaluator: runtime_observation
    title: Logging runtime observation
    category: runtime-observation
    description: Records package-attributed logging events for evidence correlation.
    severity: info
    confidence: medium
    observation_only: true
    validation_type: instrumented_validation
    frida_required: true
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Review sensitive values observed in target-process logs.

  - id: ASL-RUNTIME-STORAGE
    evaluator: storage_observation
    title: Private storage observation
    category: runtime-observation
    description: Records bounded private-storage metadata and policy observations; root readability is not itself a finding.
    severity: info
    confidence: medium
    observation_only: true
    validation_type: post_compromise_observation
    root_required: true
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Review sensitive storage observations against the application's protection requirements.

  - id: ASL-RUNTIME-ROOT
    evaluator: runtime_observation
    title: Root-detection runtime observation
    category: runtime-observation
    description: Records observed root-detection behavior without treating root capability as an application vulnerability.
    severity: info
    confidence: medium
    observation_only: true
    validation_type: instrumented_validation
    frida_required: true
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Review root-detection behavior in the application's threat model.
