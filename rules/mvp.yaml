schema_version: 1
rules:
  - id: ASL-MVP-001
    evaluator: app_debuggable
    title: Debuggable or test-only application build
    category: code-quality
    description: The installed application build permits debugging or is marked test-only.
    severity: high
    confidence: high
    required_capabilities: [AAPT2_AVAILABLE]
    inputs: [app.manifest.debuggable, app.manifest.test_only]
    validation_type: none
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Disable android:debuggable and android:testOnly in release builds.

  - id: ASL-MVP-002
    evaluator: cleartext
    title: Cleartext network traffic or permissive cleartext configuration
    category: network
    description: Cleartext is enabled in configuration or HTTP traffic was observed dynamically.
    severity: high
    confidence: high
    required_capabilities: [AAPT2_AVAILABLE]
    inputs: [app.manifest.uses_cleartext_traffic, traffic.events]
    validation_type: adb_assisted_validation
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Enforce HTTPS and deny cleartext traffic in Network Security Configuration.

  - id: ASL-MVP-003
    evaluator: sensitive_token
    title: Sensitive token exposed in URL or application log
    category: data-storage
    description: A sensitive token-shaped value was observed in a URL query or target-process log.
    severity: high
    confidence: high
    required_capabilities: [LOGCAT_ACCESS]
    inputs: [traffic.events.sensitive_query_keys, logcat.sensitive_marker_types]
    validation_type: adb_assisted_validation
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Keep tokens out of URLs and logs; use protected headers and remove sensitive logging.

  - id: ASL-MVP-004
    evaluator: exported_component
    title: Exported component without an explicit protection boundary
    category: platform
    description: A non-launcher component is exported without an explicit permission boundary.
    severity: medium
    confidence: medium
    required_capabilities: [AAPT2_AVAILABLE]
    inputs: [app.manifest.components]
    validation_type: adb_assisted_validation
    validation_observable: Target-process evidence contains the exact controlled canary after launch.
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Disable unnecessary exports or enforce a signature-level permission and input validation.

  - id: ASL-MVP-005
    evaluator: tls_interception
    title: TLS interception and certificate trust behavior
    category: network
    description: Records whether HTTPS completed through the configured lab interception proxy.
    severity: info
    confidence: medium
    required_capabilities: [MITMPROXY_AVAILABLE]
    inputs: [traffic.events, frida.events]
    validation_type: instrumented_validation
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Define the intended trust model and use pinning only where justified by the threat model.

  - id: ASL-MANIFEST-ALLOW-BACKUP
    evaluator: manifest_policy
    title: Application backup policy
    category: configuration
    description: Evaluates the normalized allowBackup manifest attribute.
    severity: medium
    confidence: medium
    validation_type: none
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Review backup policy against the application's data protection requirements.

  - id: ASL-MANIFEST-EXPORTED-ACTIVITY
    evaluator: manifest_policy
    title: Exported activity protection boundary
    category: platform
    description: Evaluates exported activities and their normalized permission boundary.
    severity: medium
    confidence: medium
    validation_type: none
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Restrict exported activities or enforce an appropriate permission.

  - id: ASL-MANIFEST-EXPORTED-RECEIVER
    evaluator: manifest_policy
    title: Exported receiver protection boundary
    category: platform
    description: Evaluates exported receivers and their normalized permission boundary.
    severity: medium
    confidence: medium
    validation_type: none
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Restrict exported receivers or enforce an appropriate permission.

  - id: ASL-MANIFEST-EXPORTED-PROVIDER
    evaluator: manifest_policy
    title: Exported provider protection boundary
    category: platform
    description: Evaluates exported providers and their normalized permission boundary.
    severity: high
    confidence: medium
    validation_type: none
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Restrict exported providers and review read/write permissions.

  - id: CRYPTO-ECB
    evaluator: crypto_runtime
    title: ECB mode observed at runtime
    category: crypto
    description: Evaluates runtime crypto metadata for ECB mode.
    severity: medium
    confidence: high
    validation_type: instrumented_validation
    observation_only: false
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Use an authenticated mode with a fresh IV instead of ECB.

  - id: CRYPTO-WEAK-ALGORITHM
    evaluator: crypto_runtime
    title: Weak runtime crypto algorithm
    category: crypto
    description: Evaluates runtime crypto metadata for configured weak algorithms.
    severity: high
    confidence: high
    validation_type: instrumented_validation
    observation_only: false
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Replace weak algorithms with a modern, policy-approved primitive.

  - id: ASL-RUNTIME-WEBVIEW
    evaluator: runtime_observation
    title: WebView runtime observation
    category: runtime-observation
    description: Records package-attributed WebView events without treating loadUrl alone as a vulnerability.
    severity: info
    confidence: medium
    observation_only: true
    validation_type: instrumented_validation
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Review observed WebView configuration in application context.

  - id: ASL-RUNTIME-LOGGING
    evaluator: runtime_observation
    title: Logging runtime observation
    category: runtime-observation
    description: Records package-attributed logging events for evidence correlation.
    severity: info
    confidence: medium
    observation_only: true
    validation_type: instrumented_validation
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Review sensitive values observed in target-process logs.

  - id: ASL-RUNTIME-STORAGE
    evaluator: storage_observation
    title: Private storage observation
    category: runtime-observation
    description: Records bounded private-storage metadata and policy observations; root readability is not itself a finding.
    severity: info
    confidence: medium
    observation_only: true
    validation_type: post_compromise_observation
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Review sensitive storage observations against the application's protection requirements.

  - id: ASL-RUNTIME-ROOT
    evaluator: runtime_observation
    title: Root-detection runtime observation
    category: runtime-observation
    description: Records observed root-detection behavior without treating root capability as an application vulnerability.
    severity: info
    confidence: medium
    observation_only: true
    validation_type: instrumented_validation
    masvs_mapping: mapping_pending
    mastg_mapping: mapping_pending
    cwe_mapping: mapping_pending
    remediation: Review root-detection behavior in the application's threat model.
