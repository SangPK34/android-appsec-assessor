schema_version: 2
statuses: [detected, partially_detected, observable_only, not_supported]
detection_modes: [static, autonomous_runtime, controlled_validation, guided]
id_kinds:
  production_rule: IDs present in rules/mvp.yaml and evaluated by RuleEngine.
  analyzer_result: IDs emitted by an analyzer but not independently evaluated by RuleEngine.
  inventory_only: IDs identify evidence inventory and never imply a finding.
  planned: ASL-PLANNED-* IDs describe explicit unsupported or deferred coverage.
coverage_defaults: &coverage_defaults
  detection_mode: static
  activation_required: apk_inspection
  manual_interaction_required: false
  auto_confirm_possible: false
  runtime_sources: []
runtime_correlation_defaults: &runtime_correlation_defaults
  <<: *coverage_defaults
  detection_mode: autonomous_runtime
  activation_required: autonomous_exploration
  auto_confirm_possible: true
  runtime_sources: [frida, autonomous_explorer]
runtime_observation_defaults: &runtime_observation_defaults
  <<: *coverage_defaults
  detection_mode: autonomous_runtime
  activation_required: autonomous_exploration
  runtime_sources: [frida, autonomous_explorer]
network_runtime_defaults: &network_runtime_defaults
