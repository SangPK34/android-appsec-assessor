  activation_required: traffic_capture_and_autonomous_exploration
  runtime_sources: [traffic, frida, autonomous_explorer]
storage_runtime_defaults: &storage_runtime_defaults
  <<: *runtime_correlation_defaults
  activation_required: root_storage_and_autonomous_exploration
  runtime_sources: [private_storage, frida, autonomous_explorer]
